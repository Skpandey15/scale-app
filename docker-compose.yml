# LEGACY single-node dev stack (no Kafka, no HA, no PgBouncer). The real deployment is k8s/ (see ARCHITECTURE.md).
# JWT_SECRET must be set for anything beyond local experiments; the backend no longer has a built-in default.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/app
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dev-secret-dev-secret-dev-secret-dev-secret-1234}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    deploy:
      replicas: 3          # stateless: add replicas freely behind the load balancer

  web:
    build: ./frontend
    ports: ["8088:80"]
    depends_on: [backend]

volumes:
  pgdata:
