# MongoDB for the catalog service (curated media metadata).
# Single node on purpose (memory): a replica set would add failover, so the catalog's resilience here comes from
# the read-path circuit breaker + stale cache and from Kafka buffering writes, not from Mongo HA.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: scale
data:
  # Runs once on first start (the image sources *.sh files): create a least-privilege application user.
  10-app-user.sh: |
    mongosh --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin <<EOF
    use catalog
    db.createUser({ user: "catalog", pwd: "$MONGO_APP_PASSWORD", roles: [{ role: "readWrite", db: "catalog" }] })
    EOF
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: scale
spec:
  selector: { app: mongo }
  ports: [{ port: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: scale
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      enableServiceLinks: false
      containers:
        - name: mongo
          image: mongo:7
          args: ["--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
          ports: [{ containerPort: 27017 }]
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: root }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: catalog-secrets, key: MONGO_ROOT_PASSWORD } }
            - name: MONGO_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: catalog-secrets, key: MONGO_APP_PASSWORD } }
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init
          configMap: { name: mongo-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
