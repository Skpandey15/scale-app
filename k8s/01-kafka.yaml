# 3-broker KRaft Kafka (no ZooKeeper). Each node is broker + controller; topics use RF 3 / min ISR 2,
# so any single broker can fail with no data loss and no producer interruption (acks=all).
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: scale
spec:
  clusterIP: None
  publishNotReadyAddresses: true      # brokers must resolve each other before they are Ready (quorum bootstrap)
  selector: { app: kafka }
  ports:
    - { name: broker, port: 9092 }
    - { name: controller, port: 9093 }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: scale
spec:
  selector: { app: kafka }
  ports: [{ name: broker, port: 9092 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka
  namespace: scale
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: kafka }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: scale
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: kafka }
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              export KAFKA_NODE_ID=$(( ${HOSTNAME##*-} + 1 ))
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless.scale.svc.cluster.local:9092"
              exec /__cacert_entrypoint.sh /etc/kafka/docker/run
          ports:
            - { containerPort: 9092 }
            - { containerPort: 9093 }
          env:
            - { name: CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-headless.scale.svc.cluster.local:9093,2@kafka-1.kafka-headless.scale.svc.cluster.local:9093,3@kafka-2.kafka-headless.scale.svc.cluster.local:9093"
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_MIN_INSYNC_REPLICAS, value: "2" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "2" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }   # topics are declared by the app, never implicit
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms192m -Xmx320m" }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 640Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
