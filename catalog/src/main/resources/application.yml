server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /catalog          # the ingress routes /catalog/* to this service

management:
  server:
    port: 8081                      # actuator lives on its own port: it is NOT reachable through the ingress
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState   # Mongo/Redis/Kafka outages must degrade features, not unready every pod

spring:
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/catalog}
      auto-index-creation: true     # creates the text index used by search
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 200ms
  graphql:
    schema:
      introspection:
        enabled: false              # do not hand attackers a map of the API
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 2000
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
    consumer:
      auto-offset-reset: earliest
    listener:
      concurrency: 2
    streams:
      application-id: catalog-ingest-rate
      replication-factor: ${KAFKA_TOPIC_REPLICAS:3}
      properties:
        num.stream.threads: 1
        commit.interval.ms: 5000
        state.dir: /tmp/kafka-streams

catalog:
  api-key: ${CATALOG_API_KEY}       # no default on purpose: the service refuses to start without a real key
  kafka-replicas: ${KAFKA_TOPIC_REPLICAS:3}
  cache-ttl-seconds: 60
